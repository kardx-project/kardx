group=io.github.kardx-project
version=0.1
kotlin.code.style=official
# 배포 POM 의 프로젝트 주소. 저장소를 만들면 여기만 바꾼다.
projectUrl=https://github.com/kardx-project/kardx

# Kotlin 2.4 컴파일러는 기본 힙(512m)으로 샘플 테스트 컴파일 중 메모리가 모자란다
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
