  /api/v1/products/{id}/images:
    post:
      tags:
      - 상품 API
      summary: 상품 이미지 업로드
      description: 이미지 파일과 메타데이터를 multipart 로 올린다.
      operationId: uploadImage
      parameters:
      - name: id
        in: path
        description: 상품 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - meta
              properties:
                file:
                  type: string
                  format: binary
                  description: 이미지 파일 (PNG, JPEG)
                meta:
                  type: object
                  properties:
                    alt:
                      type: string
                      description: 대체 텍스트
                      minLength: 1
                    primary:
                      type: boolean
                      description: 대표 이미지 여부
                  required:
                  - alt
                  - primary
                  description: 이미지 메타데이터 (JSON)
            encoding:
              meta:
                contentType: application/json
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ImageResponse"
              examples:
                product-api-docs-test/upload-image:
                  summary: 상품 이미지 업로드
                  value:
