openapi: 3.0.1
info:
  title: kardx 예제 API
  description: |-
    통과한 테스트의 REST Docs 스니펫에서 추출한 HTTP API 스펙.

    WebSocket·STOMP·Server-Sent Events 메시지는 [WebSocket·SSE 메시지 문서](/docs/async/index.html), 전체 문서는 [REST Docs](/docs/index.html) 에서 볼 수 있습니다.
  version: "0.1"
  contact:
    name: API 팀
    email: api@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /
tags:
- name: 사용자 API
  description: 회원 관리
- name: 상품 API
  description: 상품 조회·등록·검색
- name: 결제 API
- name: 배송비 API (API 버전)
- name: 쿠폰 목록 API (RestTestClient)
- name: 메모 API
- name: 인증 API
- name: 쿠폰 API
- name: 엣지 케이스 API
- name: 알림 스트림 API
- name: 마이페이지
- name: 사용자 검색 API (Kotest)
  description: Kotest BehaviorSpec 으로 문서화
paths:
  /api/shipping-fees:
    get:
      tags:
      - 배송비 API (API 버전)
      summary: 배송비 조회 (1.1)
      description: 지역의 배송비를 조회한다. 1.1 부터 제주·도서 산간 추가 요금을 더한다.
      operationId: fee
      parameters:
      - name: region
        in: query
        description: 배송 지역
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        description: API 버전
        required: true
        schema:
          type: string
          enum:
          - "1.1"
        example: "1.1"
      responses:
        "200":
          description: "OK: 배송비 조회 (1.0)"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ShippingFeeResponse"
              examples:
                shipping-fee-docs-test/shipping-fee:
                  summary: 배송비 조회 (1.1)
                  value:
                    region: JEJU
                    fee: 6000
                shipping-fee-docs-test/shipping-fee-v1:
                  summary: 배송비 조회 (1.0)
                  value:
                    region: JEJU
                    fee: 3000
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-api-version: "1.1"
      security: []
  /api/v1/coupons:
    get:
      tags:
      - 쿠폰 목록 API (RestTestClient)
      summary: 쿠폰 목록
      description: 쿠폰 목록을 조회한다. RestTestClient 로 실제 서버에 보낸 요청에서 문서를 만들었다.
      operationId: listCoupons
      parameters:
      - name: usableOnly
        in: query
        description: 사용 가능한 쿠폰만
        required: false
        schema:
          type: string
          default: "false"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCouponResponse"
              examples:
                coupon-list-docs-test/list-coupons:
                  summary: 쿠폰 목록
                  value:
                    code: 200
                    message: OK
                    data:
                    - code: WELCOME15
                      discountRate: 15
                      expiresAt: "2026-12-31"
                      usable: true
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/memos:
    get:
      tags:
      - 메모 API
      summary: 메모 목록을 페이지로 나눠 조회한다
      description: 메모 목록을 페이지로 나눠 조회한다. 메모를 ID 순으로 MemoSearchCondition.page·MemoSearchCondition.size 로 나눠 돌려준다. color 를 보내면 그 색의 메모만 돌려준다.
      operationId: listMemos
      parameters:
      - name: color
        in: query
        description: |-
          이 색(MemoColor)의 메모만 돌려준다. 보내지 않으면 모든 색

          YELLOW : 노란색. 색을 고르지 않으면 이 색이다.

          PINK : 분홍색. 급한 일에 쓴다.

          BLUE : 하늘색. 끝난 일을 모아 둘 때 쓴다.
        required: false
        schema:
          type: string
          enum:
          - YELLOW
          - PINK
          - BLUE
      - name: page
        in: query
        description: 페이지 번호 (0부터)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: 페이지 크기
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/MemoPage"
              examples:
                memo-api-docs-test/list-memos:
                  summary: 메모 목록 조회
                  value:
                    total: 1
                    page: 0
                    size: 20
                    content:
                    - id: 1
                      title: 장보기
                      content: 우유, 달걀
                      color: YELLOW
                      tags:
                      - 집
                      reminder:
                        remindAt: "2026-11-20T18:00:00"
                        daily: false
                      createdAt: "2026-11-20T09:00:00"
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
    post:
      tags:
      - 메모 API
      summary: 새 메모를 작성한다
      description: 새 메모를 작성한다. 저장한 메모를 ID 와 작성 시각을 채워 돌려준다. 색을 보내지 않으면 노란색(YELLOW) 메모가 된다.
      operationId: createMemo
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CreateMemoRequest"
            examples:
              memo-api-docs-test/create-memo:
                summary: 메모 작성
                value:
                  title: 병원 예약
                  content: 오전 10시 치과
                  color: PINK
                  tags:
                  - 건강
                  reminder:
                    remindAt: "2026-11-21T09:00:00"
                    daily: false
      responses:
        "201":
          description: Created
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/MemoResponse"
              examples:
                memo-api-docs-test/create-memo:
                  summary: 메모 작성
                  value:
                    id: 3
                    title: 병원 예약
                    content: 오전 10시 치과
                    color: PINK
                    tags:
                    - 건강
                    reminder:
                      remindAt: "2026-11-21T09:00:00"
                      daily: false
                    createdAt: "2026-11-20T09:00:00"
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/payments:
    post:
      tags:
      - 결제 API
      summary: 결제 요청
      description: 주문 결제. 주문 금액을 결제한다. 결제 수단은 `method.type` 으로 고른다 (`CARD`, `BANK_TRANSFER`).
      operationId: pay
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
            examples:
              payment-api-docs-test/pay-by-bank-transfer:
                summary: 계좌이체 결제
                value:
                  orderId: 3002
                  amount: 32000
                  currency: KRW
                  method:
                    type: BANK_TRANSFER
                    bankCode: "004"
                    depositor: 홍길동
              payment-api-docs-test/pay-by-card:
                summary: 카드 결제
                value:
                  orderId: 3001
                  amount: 59000
                  currency: KRW
                  method:
                    type: CARD
                    cardNumber: 1234-****-****-5678
                    installmentMonths: 3
      responses:
        "201":
          description: Created
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
              examples:
                payment-api-docs-test/pay-by-bank-transfer:
                  summary: 계좌이체 결제
                  value:
                    code: 200
                    message: OK
                    data:
                      id: 501
                      orderId: 3002
                      amount: 32000
                      currency: KRW
                      method:
                        type: BANK_TRANSFER
                        bankCode: "004"
                        depositor: 홍길동
                      approvedAt: "2026-11-19T14:30:00"
                payment-api-docs-test/pay-by-card:
                  summary: 카드 결제
                  value:
                    code: 200
                    message: OK
                    data:
                      id: 501
                      orderId: 3001
                      amount: 59000
                      currency: KRW
                      method:
                        type: CARD
                        cardNumber: 1234-****-****-5678
                        installmentMonths: 3
                      approvedAt: "2026-11-19T14:30:00"
        "401":
          description: 토큰이 없거나 만료됨
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - oauth2:
        - payments:write
  /api/v1/products:
    get:
      tags:
      - 상품 API
      summary: 상품 검색
      description: 조건으로 상품을 검색한다. 모든 조건은 선택이다.
      operationId: search
      parameters:
      - name: keyword
        in: query
        description: 검색어 (상품명 부분 일치)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: |-
          상태

          SALE : 판매중

          SOLD_OUT : 품절

          HIDDEN : 숨김
        required: false
        schema:
          type: string
          enum:
          - SALE
          - SOLD_OUT
          - HIDDEN
      - name: minPrice
        in: query
        description: 최소 가격
        required: false
        schema:
          type: integer
          format: int64
      - name: priceFrom
        in: query
        description: 최소 가격 (예전 이름)
        required: false
        schema:
          type: integer
          format: int64
        deprecated: true
      - name: page
        in: query
        description: 페이지 번호
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: 페이지 크기
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/PageResponseProductSummary"
              examples:
                product-api-docs-test/search-products:
                  summary: 상품 검색
                  value:
                    code: 200
                    message: OK
                    data:
                      total: 1
                      page: 0
                      size: 20
                      content:
                      - id: 1
                        name: 키보드
                        price: 59000
                        status: SALE
        "400":
          description: "검색 조건 형식이 잘못됨 (예: `minPrice` 가 숫자가 아님)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
    post:
      tags:
      - 상품 API
      summary: 상품 등록
      description: 상품을 등록한다. 생성된 상품 위치는 `Location` 헤더로 돌려준다.
      operationId: create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            examples:
              product-api-docs-test/create-product:
                summary: 상품 등록
                value:
                  name: 기계식 키보드
                  price: 59000
                  tags:
                  - 키보드
                  options:
                  - name: 갈축
                    additionalPrice: 0
                  categoryId: 3
              product-api-docs-test/create-product-invalid:
                summary: 상품 등록 - 잘못된 입력 (400)
                value:
                  name: ""
                  price: -1
                  tags: []
                  options: []
                  categoryId: null
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: 생성된 상품 URI
              schema:
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ProductResponse"
              examples:
                product-api-docs-test/create-product:
                  summary: 상품 등록
                  value:
                    code: 200
                    message: OK
                    data:
                      id: 10
                      name: 기계식 키보드
                      price: 59000
                      status: SALE
                      tags:
                      - 키보드
                      options:
                      - name: 갈축
                        additionalPrice: 0
                      - name: 적축
                        additionalPrice: 3000
                      category:
                        id: 3
                        name: 주변기기
                      createdAt: "2026-11-05T10:00:00"
        "400":
          description: "Bad Request: 상품 등록 - 잘못된 입력 (400)"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                product-api-docs-test/create-product-invalid:
                  summary: 상품 등록 - 잘못된 입력 (400)
                  value:
                    code: 400
                    message: 입력값이 올바르지 않습니다
                    errors:
                    - field: name
                      reason: must not be blank
                    - field: price
                      reason: must be greater than or equal to 0
        "409":
          description: 같은 이름의 상품이 이미 있음
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/users:
    get:
      tags:
      - 사용자 API
      summary: 사용자 목록 조회
      description: 사용자 목록 조회. 가입한 사용자를 page·size 로 나눠 돌려준다.
      operationId: listUsers
      parameters:
      - name: page
        in: query
        description: 페이지 번호
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: 페이지 크기
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 20
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ListUserResponse"
              examples:
                user-controller-test/list-users:
                  summary: 사용자 목록 조회
                  value:
                  - id: 1
                    nickname: 홍길동
                    email: h**g@example.com
                    status: ACTIVE
                  - id: 2
                    nickname: 김철수
                    email: k*m@example.com
                    status: INACTIVE
        "400":
          description: "`page`·`size` 가 숫자가 아님"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
    post:
      tags:
      - 사용자 API
      summary: 사용자 생성
      description: 새 사용자를 생성한다.
      operationId: createUser
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              user-controller-test/create-user:
                summary: 사용자 생성
                value:
                  nickname: 홍길동
                  email: hong@example.com
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/UserResponse"
              examples:
                user-controller-test/create-user:
                  summary: 사용자 생성
                  value:
                    id: 1
                    nickname: 홍길동
                    email: h**g@example.com
                    status: ACTIVE
        "400":
          description: 입력값 검증 실패. 잘못된 필드는 `errors` 에 있다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                message: 입력값이 올바르지 않습니다
                errors:
                - field: email
                  reason: must be a well-formed email address
        "409":
          description: 이미 가입한 이메일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                message: 이미 가입한 이메일입니다
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - 인증 API
      summary: 로그인
      description: 폼으로 로그인하고 세션 쿠키를 받는다.
      operationId: login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/api-v1-auth-login-305410694"
            examples:
              auth-api-docs-test/login:
                summary: 로그인
                value: username=hong&password=****&rememberDays=7
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              description: |-
                세션 쿠키

                쿠키:

                `SESSION`: 세션 ID (HttpOnly)
              schema:
                type: string
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/auth/me:
    get:
      tags:
      - 인증 API
      summary: 내 정보
      description: 세션 쿠키로 로그인한 사용자를 조회한다.
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/MeResponse"
              examples:
                auth-api-docs-test/me:
                  summary: 내 정보
                  value:
                    username: hong
                    sessionPrefix: s3cr
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
      - name: SESSION
        in: cookie
        description: 로그인 시 받은 세션 ID
        required: true
        schema:
          type: string
      security: []
  /api/v1/coupons/{code}:
    get:
      tags:
      - 쿠폰 API
      summary: 쿠폰 조회
      description: 쿠폰 코드로 할인 정보를 조회한다.
      operationId: couponGet
      parameters:
      - name: code
        in: path
        description: 쿠폰 코드
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/CouponResponse"
              examples:
                coupon-api-docs-test/get-coupon:
                  summary: 쿠폰 조회
                  value:
                    code: 200
                    message: OK
                    data:
                      code: WELCOME15
                      discountRate: 15
                      expiresAt: "2026-12-31"
                      usable: true
        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
  /api/v1/edge/accounts:
    post:
      tags:
      - 엣지 케이스 API
      summary: 계정 만들기
      description: 요청에는 비밀번호, 응답에는 가입 시각이 있다.
      operationId: createAccount
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/AccountRequest"
            examples:
              edge-case-docs-test/overloaded:
                summary: 계정 만들기
                value:
                  username: hong
                  password: p@ssw0rd
              edge-case-docs-test/overloaded-test-info:
                summary: 계정 만들기 (TestInfo 오버로드)
                value:
                  username: overloaded
                  password: pw
      responses:
        "200":
          description: "OK: 계정 만들기 (TestInfo 오버로드)"
