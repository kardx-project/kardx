  /api/v1/notifications/stream:
    get:
      tags:
      - 알림 스트림 API
      summary: 알림 구독 (SSE)
      description: 알림을 Server-Sent Events 로 받는다. 연결 직후 `connected` 이벤트가 한 번 오고, 이후 알림마다 `notification` 이벤트가 온다. 토큰이 없으면 401 이다.
      operationId: stream
      parameters:
      - name: access_token
        in: query
        description: 액세스 토큰 (샘플 앱은 `demo-token`). 헤더를 붙일 수 없는 브라우저 EventSource 용. `Authorization` 헤더로 보내도 된다
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer 액세스 토큰. `access_token` 쿼리 대신 보낸다
        required: false
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        description: 재연결 시 마지막으로 받은 이벤트 ID
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/event-stream;charset=UTF-8:
              schema:
                type: string
              examples:
                notification-api-docs-test/subscribe:
                  summary: 알림 구독 (SSE)
                  value: |+
                    event:connected
                    data:{"clientId":"client-1","retryMillis":3000}

                    :heartbeat

                    id:1
                    event:notification
                    data:{"id":1,"type":"PRICE_DROP","title":"관심 상품 가격이 내려갔어요","productId":10}

        "500":
          description: 서버 오류
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []
