# Boot 3 샘플 전용 (Boot 4 샘플에는 없다). Jackson 2 는 Spring Data `PageImpl` 처럼 getter 로 쓰는 속성의 순서가
# 실행(JVM)마다 달라, 응답 본문 스니펫과 WireMock 매핑이 매번 바뀌고 asciidoctor 가 다시 돈다.
# Jackson 3(Boot 4)의 기본값과 같은 규칙으로 맞춘다: 생성자 프로퍼티는 선언 순서대로 앞에, 나머지는 이름순.
# 문서화한 필드 경로(pageable.pageNumber 등)는 바뀌지 않는다. Jackson 3 에는 두 번째 키가 없으므로 Boot 4 에 넣으면 앱이 뜨지 않는다.
# 다른 방법: @EnableSpringDataWebSupport(pageSerializationMode = VIA_DTO) 는 JSON 모양(page.size 등)과 필드 경로가 바뀐다.
spring:
  jackson:
    mapper:
      sort-properties-alphabetically: true
      sort-creator-properties-by-declaration-order: true
