name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      # gradle-plugin 은 toolchain 17 을 요구하고 foojay 자동 설치가 없다 -> 17 을 항상 함께 설치.
      # 마지막에 적은 버전이 JAVA_HOME (= Gradle 실행 JDK) 이 된다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}

      # 의존성·wrapper 캐시 + gradle-wrapper.jar 체크섬 검증 포함. main 이 아닌 브랜치는 캐시 read-only.
      - uses: gradle/actions/setup-gradle@v6

      # 샘플 build 는 apiDocs(테스트 -> AsciiDoc HTML, OpenAPI, AsyncAPI)까지 포함한다.
      # 루트 build 는 gradle-plugin(included build)의 build 도 함께 돌린다 (루트 build.gradle.kts).
      - name: Build, test, ktlint, detekt, sample docs
        run: ./gradlew build --continue

      # core·kotest·kotest5(공유 소스 kotest-common 포함)·gradle-plugin 의 패키지 의존 순환 검사 (순환이 있으면 종료 코드 1)
      - name: Check package cycles
        run: python3 scripts/check-package-cycles.py

      # 스크립트는 FAIL 이 하나라도 있으면 종료 코드 1. 세 샘플을 모두 돌린 뒤 판정한다.
      - name: Verify generated docs (Boot 3, Boot 4, Boot 4 WebFlux)
        run: |
          rc=0
          for s in spring-boot-3 spring-boot-4 spring-boot-4-webflux; do
            echo "::group::$s"
            python3 scripts/verify-docs-artifacts.py "samples/$s" || { rc=1; echo "::error::$s docs verification failed"; }
            echo "::endgroup::"
          done
          exit $rc

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 스크립트는 오류가 있는 문서가 하나라도 있으면 종료 코드 1.
      - name: Validate AsyncAPI with official parser
        run: |
          PARSER_DIR="$RUNNER_TEMP/asyncapi-parser"
          mkdir -p "$PARSER_DIR"
          npm install --prefix "$PARSER_DIR" --no-audit --no-fund @asyncapi/parser@3
          node scripts/validate-asyncapi.mjs "$PARSER_DIR" \
            samples/spring-boot-3/build/api-docs/asyncapi.yaml \
            samples/spring-boot-4/build/api-docs/async/index.yaml \
            samples/spring-boot-4-webflux/build/api-docs/asyncapi.yaml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      # 사람이 PR 에서 결과 문서를 바로 열어 볼 수 있게 (JDK 21 한 번만)
      - name: Upload sample docs
        if: success() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: sample-api-docs
          path: samples/*/build/api-docs/
          retention-days: 7
