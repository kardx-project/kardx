name: Feature request (기능 제안)
description: Suggest a new feature or an improvement. (새 기능이나 개선 아이디어를 제안해 주세요.)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve (해결하려는 문제)
      description: What is inconvenient or impossible today? (지금 어떤 점이 불편하거나 불가능한가요?)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (제안하는 방법)
      description: Describe the DSL, settings or output you want, with example code. (원하는 DSL·설정·출력 형태를 예시 코드와 함께 적어 주세요.)
      render: kotlin
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (고려한 대안)
      description: Workarounds you use now or other approaches, if any. (지금 쓰고 있는 우회 방법이나 다른 접근이 있다면 적어 주세요.)
  - type: textarea
    id: additional
    attributes:
      label: Additional information (추가 정보)
