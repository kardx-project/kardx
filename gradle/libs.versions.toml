[versions]
kotlin = "2.4.21"
# 배포 라이브러리가 지원하는 Kotlin 하한. 메타데이터(languageVersion·apiVersion)와 POM 의 kotlin-stdlib 버전이 된다
kotlin-baseline = "2.2.21"
spring-restdocs = "3.0.6"
spring-restdocs-v4 = "4.0.2"
spring-framework = "6.2.19"
spring-boot-v3 = "3.5.16"
spring-boot-v4 = "4.1.2"
epages = "0.19.4"
epages-v4 = "0.20.2"
junit = "5.14.4"
jakarta-validation = "3.0.2"
jackson = "2.21.4"
# tooling 의 epages 생성기 호출(compileOnly). epages 0.20.x 가 쓰는 Jackson 3
jackson3 = "3.0.2"
kotest = "6.2.7"
# kotest5 모듈(kardx-kotest5)이 컴파일·테스트하는 Kotest 5.x 와 그 Spring 확장 (별도 좌표)
kotest5 = "5.9.1"
kotest5-extensions-spring = "1.3.0"
springdoc-v3 = "2.8.17"
springdoc-v4 = "3.2.0"
asciidoctor = "4.0.5"
dokka = "2.3.0"
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
detekt = "1.23.8"
# detekt 1.23 이 빌드된 Kotlin. detekt 클래스패스의 Kotlin 을 이 버전으로 고정한다
detekt-kotlin = "2.0.21"
binary-compatibility-validator = "0.18.2"
jakarta-servlet = "6.0.0"
json-path = "2.9.0"
# compileOnly: MockMvcTester(MvcTestResult) 진입점이 AssertJ 의 AssertProvider 를 상속한다
assertj = "3.27.7"
snakeyaml = "2.4"
# tooling(빌드 도구와 무관한 후처리)의 JSON 읽기·쓰기. Gradle 플러그인은 Gradle 이 내장한 Groovy 를 쓴다
groovy = "4.0.33"
# Maven 플러그인(maven-plugin): Maven API 는 provided, 목표 어노테이션은 컴파일 전용
maven = "3.9.11"
maven-plugin-tools = "3.16.0"
swagger-annotations = "2.2.56"
# 테스트 전용: Spring Data Page·Pageable 추출 확인 (core 는 컴파일 의존하지 않는다)
spring-data-commons = "3.5.13"
# 테스트 전용: HATEOAS(HAL) 모양 추출 확인 (core 는 컴파일 의존하지 않는다). 2.5.x = Spring 6 / Jackson 2
spring-hateoas = "2.5.3"
# compileOnly: @Serializable 클래스의 serial descriptor 를 읽는다. 앱에 kotlinx.serialization 이 있을 때만 로드한다
kotlinx-serialization = "1.9.0"
# 테스트 전용: WebTestClient 의 BodySpec 구현이 로드할 때 필요하다 (Boot 사용자는 spring-boot-starter-test 로 받는다)
hamcrest = "3.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# Spring REST Docs
spring-restdocs-core = { module = "org.springframework.restdocs:spring-restdocs-core", version.ref = "spring-restdocs" }
spring-restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc", version.ref = "spring-restdocs" }
spring-restdocs-mockmvc-v4 = { module = "org.springframework.restdocs:spring-restdocs-mockmvc", version.ref = "spring-restdocs-v4" }
spring-restdocs-webtestclient = { module = "org.springframework.restdocs:spring-restdocs-webtestclient", version.ref = "spring-restdocs" }
spring-restdocs-webtestclient-v4 = { module = "org.springframework.restdocs:spring-restdocs-webtestclient", version.ref = "spring-restdocs-v4" }

# epages: 0.19.x = Spring Boot 3 / REST Docs 3, 0.20.x = Spring Boot 4 / REST Docs 4
epages-restdocs-api-spec = { module = "com.epages:restdocs-api-spec", version.ref = "epages" }
epages-restdocs-api-spec-mockmvc = { module = "com.epages:restdocs-api-spec-mockmvc", version.ref = "epages" }
epages-restdocs-api-spec-mockmvc-v4 = { module = "com.epages:restdocs-api-spec-mockmvc", version.ref = "epages-v4" }
epages-restdocs-api-spec-webtestclient-v4 = { module = "com.epages:restdocs-api-spec-webtestclient", version.ref = "epages-v4" }
# tooling 명령줄·Maven 플러그인이 OpenAPI 기본 스펙을 만드는 생성기 (Gradle 은 epages 플러그인이 만든다)
epages-restdocs-api-spec-openapi3-generator = { module = "com.epages:restdocs-api-spec-openapi3-generator", version.ref = "epages-v4" }
epages-restdocs-api-spec-postman-generator = { module = "com.epages:restdocs-api-spec-postman-generator", version.ref = "epages-v4" }

# Spring Framework
spring-core = { module = "org.springframework:spring-core", version.ref = "spring-framework" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring-framework" }
spring-websocket = { module = "org.springframework:spring-websocket", version.ref = "spring-framework" }
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring-framework" }

# Jakarta
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }

# Gradle 플러그인·tooling: openapi3.yaml 후처리
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
groovy-json = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }

# Maven 플러그인 (maven-plugin)
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-tools" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson3" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
# 버전은 junit-jupiter 가 가져오는 junit-bom 이 정한다
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "json-path" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
# kotest 모듈(kardx-kotest): 엔진 API 와 Spring 확장은 compileOnly (사용자 프로젝트가 가져온다)
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
# kotest5 모듈: Kotest 5.x API(kotest-framework-api)와 Spring 확장(io.kotest.extensions 좌표)은 compileOnly, 나머지는 테스트용
kotest5-framework-api = { module = "io.kotest:kotest-framework-api", version.ref = "kotest5" }
kotest5-framework-datatest = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest5" }
kotest5-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest5" }
kotest5-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest5" }
kotest5-extensions-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotest5-extensions-spring" }
# 테스트 전용: @Schema 에서 설명을 읽는지 확인한다 (core 는 컴파일 의존하지 않는다)
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons", version.ref = "spring-data-commons" }
spring-hateoas = { module = "org.springframework.hateoas:spring-hateoas", version.ref = "spring-hateoas" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Swagger UI (springdoc): 2.8.x = Spring Boot 3.5, 3.2.x = Spring Boot 4.1
springdoc-webmvc-ui-v3 = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-v3" }
springdoc-webmvc-ui-v4 = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-v4" }
springdoc-webflux-ui-v4 = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-v4" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot-v3 = { id = "org.springframework.boot", version.ref = "spring-boot-v3" }
spring-boot-v4 = { id = "org.springframework.boot", version.ref = "spring-boot-v4" }
asciidoctor = { id = "org.asciidoctor.jvm.convert", version.ref = "asciidoctor" }
epages-v3 = { id = "com.epages.restdocs-api-spec", version.ref = "epages" }
epages-v4 = { id = "com.epages.restdocs-api-spec", version.ref = "epages-v4" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
# Maven 플러그인 설명자(plugin.xml)를 mojo 어노테이션에서 만든다 (maven-plugin 모듈)
maven-plugin-development = { id = "de.benediktritter.maven-plugin-development", version = "0.4.3" }
# Gradle Plugin Portal 배포 (gradle-plugin 의 publishPlugins)
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
